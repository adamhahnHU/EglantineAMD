name: mkw-amd-release

# One Windows build tuned for a Ryzen 7000 (Zen 4) CPU: MinGW clang with Eden's PGO profile and
# -march=znver4. It needs AVX-512 and will not start on older CPUs.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/peaceful-clarke-j8r5rr
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "cpmfile.json"
      - ".github/workflows/mkw-amd-release.yml"

permissions:
  contents: read

concurrency:
  group: mkw-amd-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: windows-x86_64-zen4 ${{ matrix.variant }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        variant: [latest]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download PGO profile
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o eden.profdata \
            https://github.com/Eden-CI/PGO/releases/latest/download/eden.profdata
          test -s eden.profdata

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja zip
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p

      - name: Cache CPM downloads
        uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Cache compiler objects
        uses: actions/cache@v5
        with:
          path: .ccache
          key: objects-windows-x86_64-zen4-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            objects-windows-x86_64-zen4-${{ matrix.variant }}-

      - name: Configure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          profile="-fprofile-use=$(cygpath -m "$PWD/eden.profdata") -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DYUZU_BUILD_PRESET=zen4 \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            "-DCMAKE_C_FLAGS=$profile" \
            "-DCMAKE_CXX_FLAGS=$profile"

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          ccache --show-stats

      # Same bundling as release-binaries.yml: Qt via windeployqt6, then every non-system DLL.
      - name: Package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          test -f eglantine.exe
          test -f eden-cli.exe
          windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler eglantine.exe
          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              case "$source" in
                *System32* | *SysWOW64*) continue ;;
              esac
              if [ ! -f "$dll" ]; then
                cp "$source" "$dll"
                deps "$source"
              fi
            done
          }
          for exe in eglantine.exe eden-cli.exe; do
            deps "$exe"
          done
          find . -name '*.dll' | while read -r dll; do
            deps "$dll"
          done
          zip -qr "$GITHUB_WORKSPACE/eglantine-mkw-amd-windows-zen4-${{ matrix.variant }}.zip" .

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: eglantine-mkw-amd-windows-zen4-${{ matrix.variant }}-${{ github.sha }}
          path: eglantine-mkw-amd-windows-zen4-${{ matrix.variant }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          pattern: eglantine-mkw-amd-windows-zen4-*-${{ github.sha }}
          merge-multiple: true
          path: dist

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="mkw-amd-${GITHUB_RUN_NUMBER}"
          cat > notes.md <<EOF
          Mario Kart World build for a Ryzen 7000 (Zen 4) CPU and an AMD Radeon GPU, from ${GITHUB_SHA}.

          - \`latest\`: this branch, with the newest upstream changes.

          Dynamic FPS keeps Mario Kart World at normal speed below 60 fps. It is on by default; turn it off under Graphics > Advanced if the game misbehaves.

          Extract a zip and run \`eglantine.exe\`. Built with MinGW clang, Eden's PGO profile and
          \`-march=znver4\`: it needs a CPU with AVX-512 (Ryzen 7000/9000) and will not start on older ones.
          EOF
          gh release create "${tag}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Eglantine MKW AMD build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes-file notes.md
